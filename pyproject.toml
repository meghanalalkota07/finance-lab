[project]
name = "ticker-explorer"
version = "0.1.0"
description = "Single-ticker Historicals + Fundamentals explorer"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.36",
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.26",
    "plotly>=5.20",
    "requests>=2.31",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "requests-mock>=1.12",
    "mypy>=1.10",
    "pandas-stubs",
    "types-requests",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
